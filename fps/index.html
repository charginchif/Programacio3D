<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIME STRIKE — First Person Shooter</title>
  <meta name="description" content="Juego FPS de estética anime en Three.js. Muévete, dispara objetivos y acumula puntos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- HUD Overlay -->
  <div id="hud">
    <div id="hud-top">
      <div id="score-panel">
        <span class="hud-label">PUNTOS</span>
        <span id="score">000000</span>
      </div>
      <div id="title-panel">ANIME STRIKE</div>
      <div id="ammo-panel">
        <span class="hud-label">MUNICIÓN</span>
        <span id="ammo">∞</span>
      </div>
    </div>

    <div id="crosshair">
      <div class="ch-line ch-top"></div>
      <div class="ch-line ch-right"></div>
      <div class="ch-line ch-bottom"></div>
      <div class="ch-line ch-left"></div>
      <div class="ch-dot"></div>
    </div>

    <div id="hud-bottom">
      <div id="kills-panel">
        <span class="hud-label">BAJAS</span>
        <span id="kills">0</span>
      </div>
      <div id="wave-panel">
        <span class="hud-label">OLA</span>
        <span id="wave">1</span>
      </div>
      <div id="combo-panel">
        <span class="hud-label">COMBO</span>
        <span id="combo">x1</span>
      </div>
    </div>

    <!-- Hit flash overlay -->
    <div id="hit-flash"></div>
    <!-- Kill notification -->
    <div id="kill-notify"></div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="start-content">
      <div class="anime-logo">
        <div class="logo-glitch" data-text="ANIME STRIKE">ANIME STRIKE</div>
        <div class="logo-sub">FIRST PERSON COMBAT</div>
      </div>
      <div class="start-instructions">
        <div class="key-grid">
          <div class="key-item"><kbd>W A S D</kbd><span>Moverse</span></div>
          <div class="key-item"><kbd>RATÓN</kbd><span>Apuntar</span></div>
          <div class="key-item"><kbd>CLIC</kbd><span>Disparar</span></div>
          <div class="key-item"><kbd>ESC</kbd><span>Pausa</span></div>
        </div>
      </div>
      <button id="start-btn">
        <span class="btn-text">INICIAR COMBATE</span>
        <span class="btn-glow"></span>
      </button>
      <div class="start-hint">Haz clic en el botón para bloquear el cursor</div>
    </div>
    <div class="start-bg-particles" id="bg-particles"></div>
  </div>

  <!-- Pause Screen -->
  <div id="pause-screen" class="hidden">
    <div class="pause-content">
      <div class="pause-title">PAUSA</div>
      <button id="resume-btn">CONTINUAR</button>
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Scripts -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
